openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Task list operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /task-api/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      responses:
        "200":
          description: Tasks ordered by creation time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "422":
          description: Invalid task data
  /task-api/tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update task completion
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDeleteResult"
        "404":
          description: Task not found
  /task-api/summary:
    get:
      operationId: getTaskSummary
      tags: [tasks]
      summary: Get task counts
      responses:
        "200":
          description: Task totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        completed:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, title, completed, createdAt]
    TaskInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
      required: [title]
    TaskUpdate:
      type: object
      properties:
        completed:
          type: boolean
      required: [completed]
    TaskSummary:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        completed:
          type: integer
      required: [total, pending, completed]
    TaskDeleteResult:
      type: object
      properties:
        deleted:
          type: boolean
      required: [deleted]

